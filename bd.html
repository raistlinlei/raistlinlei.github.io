<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD薪资全自动计算器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, "Microsoft Yahei", sans-serif;
        }
        body {
            background: #f3f4f6;
            padding: 20px;
            max-width: 950px;
            margin: 0 auto;
        }
        .container {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 24px;
            font-size: 22px;
        }
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .item {
            display: flex;
            flex-direction: column;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label {
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 6px;
        }
        input, select {
            height: 42px;
            padding: 0 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }
        input::placeholder {
            color: #9ca3af;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
        }
        .btn-wrap {
            margin: 24px 0;
            text-align: center;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 36px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        .result-box {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            background: #f9fafb;
        }
        .result-title {
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 12px;
            color: #111827;
        }
        .line {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 15px;
        }
        .total {
            margin-top:10px;
            padding-top:12px;
            border-top:1px solid #ddd;
            font-weight:bold;
            font-size:18px;
            color:#dc2626;
        }
        .tip {
            margin-top:16px;
            font-size:13px;
            color:#666;
        }
        @media(max-width:640px){
            .row{grid-template-columns:1fr;}
        }
    </style>
</head>
<body>
<div class="container">
    <h1>BD薪资全自动计算器</h1>
    <div class="row">
        <div class="item">
            <label>员工身份</label>
            <select id="staffType">
                <option value="old">老员工</option>
                <option value="new">新员工</option>
            </select>
        </div>
        <div class="item">
            <label>复购城市档位</label>
            <select id="cityRep">
                <option value="high">高复购城市</option>
                <option value="low">低复购城市</option>
            </select>
        </div>
        <div class="item">
            <label>TU城市档位</label>
            <select id="cityTu">
                <option value="high">高TU城市</option>
                <option value="low">低TU城市</option>
            </select>
        </div>
        <div class="item">
            <label>荣誉激励城市档位</label>
            <select id="cityHonor">
                <option value="high">高人效城市</option>
                <option value="low">低人效城市</option>
            </select>
        </div>
        <div class="item">
            <label>底薪</label>
            <input type="number" id="basePay" value="3400">
        </div>
        <div class="item">
            <label>有效下单</label>
            <input type="number" id="firstOrder" placeholder="请输入有效下单量">
        </div>
        <div class="item">
            <label>有效复购</label>
            <input type="number" id="repOrder" placeholder="请输入有效复购量">
        </div>
        <div class="item">
            <label>拉新TU</label>
            <input type="number" id="tuOrder" placeholder="请输入拉新TU量">
        </div>
        <div class="item">
            <label>买菜订单（SKU）</label>
            <input type="number" id="skuOrder" placeholder="请输入买菜订单（SKU）量">
        </div>
        <div class="item">
            <label>入群率</label>
            <div class="input-group">
                <input type="number" id="groupRate" placeholder="请输入入群率" step="0.01">
                <span>%</span>
            </div>
        </div>
        <div class="item">
            <label>首单单价</label>
            <input type="number" id="priceFirst" value="6">
        </div>
        <div class="item">
            <label>复购单价</label>
            <input type="number" id="priceRep" value="10">
        </div>
        <div class="item">
            <label>全勤奖</label>
            <input type="number" id="attendance" value="500">
        </div>
        <div class="item">
            <label>高温补贴</label>
            <input type="number" id="hotSubsidy" value="300">
        </div>
        <div class="item">
            <label>电动车补贴</label>
            <input type="number" id="evSubsidy" value="200">
        </div>
        <div class="item">
            <label>住房补贴</label>
            <input type="number" id="houseSubsidy" value="1400">
        </div>
    </div>
    <div class="btn-wrap">
        <button id="calcBtn">立即计算薪资</button>
    </div>
    <div class="result-box">
        <div class="result-title">📊薪资&系数计算明细</div>
        <div id="result"></div>
    </div>
    <div class="tip">
        <strong>规则说明：</strong><br>
        1. 员工身份+复购/TU/荣誉激励三套城市档位独立选择，严格匹配薪酬方案；<br>
        2. 自动根据有效下单、有效复购、拉新TU、买菜订单（SKU）、入群率，匹配4项质量系数；<br>
        3. 综合质量系数 = 复购质量系数×0.3 + TU质量系数×0.3 + 买菜质量系数×0.2 + 入群率质量系数×0.2；<br>
        4. 订单提成不乘质量系数，仅荣誉激励 × 综合质量系数。
    </div>
</div>

<script>
const honorConfig = {
    new: {
        high: [[600,5000],[500,4000],[450,3500],[400,3000],[350,2500],[300,2000],[250,1500],[200,1000],[150,500],[0,0]],
        low: [[550,5000],[450,4000],[400,3500],[350,3000],[300,2500],[250,2000],[200,1500],[150,1000],[100,500],[0,0]]
    },
    old: {
        high: [[650,5000],[550,4000],[500,3500],[450,3000],[400,2500],[350,2000],[300,1500],[250,1000],[200,500],[0,0]],
        low: [[600,5000],[500,4000],[450,3500],[400,3000],[350,2500],[300,2000],[250,1500],[200,1000],[150,500],[0,0]]
    }
};

function getRepCoeff(rate, cityType){
    const table = cityType==='high' ? [[0.5,1.5],[0.45,1.2],[0.4,1.1],[0.35,1],[0.3,0.9],[0.25,0.7],[0,0.5]]
                                     : [[0.45,1.5],[0.4,1.2],[0.35,1.1],[0.3,1],[0.25,0.9],[0.2,0.7],[0,0.5]];
    for(let item of table){
        if(rate >= item[0]) return item[1];
    }
    return 0.5;
}
function getTuCoeff(rate, cityType){
    const table = cityType==='high' ? [[0.55,1.5],[0.5,1.2],[0.45,1.1],[0.4,1],[0.35,0.9],[0.3,0.7],[0,0.5]]
                                     : [[0.45,1.5],[0.4,1.2],[0.35,1.1],[0.3,1],[0.25,0.9],[0.2,0.7],[0,0.5]];
    for(let item of table){
        if(rate >= item[0]) return item[1];
    }
    return 0.5;
}
function getSkuCoeff(rate){
    const table = [[0.75,1.5],[0.7,1.2],[0.65,1.1],[0.6,1],[0.55,0.9],[0.5,0.7],[0,0.5]];
    for(let item of table){
        if(rate >= item[0]) return item[1];
    }
    return 0.5;
}
function getGroupCoeff(rate){
    const table = [[0.75,1.5],[0.7,1.2],[0.65,1.1],[0.6,1],[0.55,0.9],[0.5,0.7],[0,0.5]];
    for(let item of table){
        if(rate >= item[0]) return item[1];
    }
    return 0.5;
}

function calcSalary(){
    try{
        const staffType = document.getElementById('staffType').value;
        const cityRep = document.getElementById('cityRep').value;
        const cityTu = document.getElementById('cityTu').value;
        const cityHonor = document.getElementById('cityHonor').value;
        const basePay = Number(document.getElementById('basePay').value);
        const firstOrder = Number(document.getElementById('firstOrder').value || 0);
        const repOrder = Number(document.getElementById('repOrder').value || 0);
        const tuOrder = Number(document.getElementById('tuOrder').value || 0);
        const skuOrder = Number(document.getElementById('skuOrder').value || 0);
        const groupRateInput = Number(document.getElementById('groupRate').value || 0);
        const groupRate = groupRateInput / 100;

        const priceFirst = Number(document.getElementById('priceFirst').value);
        const priceRep = Number(document.getElementById('priceRep').value);
        const attendance = Number(document.getElementById('attendance').value);
        const hotSubsidy = Number(document.getElementById('hotSubsidy').value);
        const evSubsidy = Number(document.getElementById('evSubsidy').value);
        const houseSubsidy = Number(document.getElementById('houseSubsidy').value);

        const repRate = firstOrder===0 ? 0 : repOrder / firstOrder;
        const tuRate = firstOrder===0 ? 0 : tuOrder / firstOrder;
        const skuRate = firstOrder===0 ? 0 : skuOrder / firstOrder;

        const coeffRep = getRepCoeff(repRate, cityRep);
        const coeffTu = getTuCoeff(tuRate, cityTu);
        const coeffSku = getSkuCoeff(skuRate);
        const coeffGroup = getGroupCoeff(groupRate);

        const qualityRate = coeffRep*0.3 + coeffTu*0.3 + coeffSku*0.2 + coeffGroup*0.2;

        const firstCommission = firstOrder * priceFirst;
        const repCommission = repOrder * priceRep;
        const totalCommission = firstCommission + repCommission;

        let honorMoney = 0;
        const levelList = honorConfig[staffType][cityHonor];
        for(let item of levelList){
            if(firstOrder >= item[0]){
                honorMoney = item[1];
                break;
            }
        }
        const honorFinal = honorMoney * qualityRate;

        const subsidySum = attendance + hotSubsidy + evSubsidy + houseSubsidy;
        const totalPay = basePay + totalCommission + honorFinal + subsidySum;

        let html = `
            <div class="line"><span>员工身份</span><span>${staffType==='old'?'老员工':'新员工'}</span></div>
            <div class="line"><span>复购城市档位</span><span>${cityRep==='high'?'高复购城市':'低复购城市'}</span></div>
            <div class="line"><span>TU城市档位</span><span>${cityTu==='high'?'高TU城市':'低TU城市'}</span></div>
            <div class="line"><span>荣誉激励城市档位</span><span>${cityHonor==='high'?'高人效城市':'低人效城市'}</span></div>
            <div class="line"><span>有效下单</span><span>${firstOrder} 单</span></div>
            <div class="line"><span>有效复购</span><span>${repOrder} 单</span></div>
            <div class="line"><span>复购率</span><span>${(repRate*100).toFixed(2)}%</span></div>
            <div class="line"><span>拉新TU占比</span><span>${(tuRate*100).toFixed(2)}%</span></div>
            <div class="line"><span>买菜订单（SKU）占比</span><span>${(skuRate*100).toFixed(2)}%</span></div>
            <div class="line"><span>入群率</span><span>${groupRateInput.toFixed(2)}%</span></div>
            <div class="line"><span>复购质量系数</span><span>${coeffRep.toFixed(2)}</span></div>
            <div class="line"><span>TU质量系数</span><span>${coeffTu.toFixed(2)}</span></div>
            <div class="line"><span>买菜质量系数</span><span>${coeffSku.toFixed(2)}</span></div>
            <div class="line"><span>入群率质量系数</span><span>${coeffGroup.toFixed(2)}</span></div>
            <div class="line"><span>✅综合质量系数</span><span>${qualityRate.toFixed(4)}</span></div>
            <div class="line"><span>首单提成</span><span>${firstCommission.toFixed(2)} 元</span></div>
            <div class="line"><span>复购提成</span><span>${repCommission.toFixed(2)} 元</span></div>
            <div class="line"><span>订单提成合计</span><span>${totalCommission.toFixed(2)} 元</span></div>
            <div class="line"><span>荣誉基础奖金</span><span>${honorMoney} 元</span></div>
            <div class="line"><span>折算后荣誉激励</span><span>${honorFinal.toFixed(2)} 元</span></div>
            <div class="line"><span>补贴合计</span><span>${subsidySum.toFixed(2)} 元</span></div>
            <div class="total line"><span>💰税前总薪资</span><span>${totalPay.toFixed(2)} 元</span></div>
        `;
        document.getElementById("result").innerHTML = html;
    }catch(err){
        console.error("计算出错：", err);
        document.getElementById("result").innerHTML = "<div style='color:red'>计算异常，请检查输入数值是否正确</div>";
    }
}

document.getElementById('calcBtn').addEventListener('click', calcSalary);
window.addEventListener('load', ()=>{
    document.getElementById("result").innerHTML = "<div style='color:#666'>请填写数据后点击计算薪资</div>";
});
</script>
</body>
</html>
